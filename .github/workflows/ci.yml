name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Format
        run: python -m ruff format --check src tests examples
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=rebuildwhy --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Build distribution
        run: python -m build
      - name: Verify installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          rebuildwhy --version
          rebuildwhy plan -p examples/synthetic_mri/pipeline.yaml --json > /tmp/rebuildwhy-plan.json
          python -c 'import json; report = json.load(open("/tmp/rebuildwhy-plan.json")); assert len(report["tasks"]) == 5'
