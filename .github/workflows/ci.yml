name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Format
        run: python -m ruff format --check src tests examples
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=rebuildwhy --cov-branch --cov-report=term-missing --cov-fail-under=80

  package:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build frontend
        run: python -m pip install 'build>=1.5,<2'
      - name: Build source and wheel distributions
        run: python -m build
      - name: Inspect source distribution contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archive = next(Path("dist").glob("*.tar.gz"))
          required = {
              "schemas/README.md",
              "schemas/error-report-v1.schema.json",
              "schemas/pipeline-v1.schema.json",
              "schemas/plan-report-v1.schema.json",
              "schemas/run-report-v1.schema.json",
          }
          with tarfile.open(archive) as bundle:
              names = bundle.getnames()
          missing = sorted(
              path for path in required if not any(name.endswith(f"/{path}") for name in names)
          )
          forbidden = (
              "/examples/synthetic_mri/.rebuildwhy/",
              "/examples/synthetic_mri/outputs/",
          )
          contaminated = sorted(
              name for name in names if any(marker in f"/{name}/" for marker in forbidden)
          )
          assert not missing, f"source distribution is missing: {missing}"
          assert not contaminated, f"source distribution contains runtime artifacts: {contaminated}"
          PY
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Smoke test installed entry points
        run: |
          python -m pip check
          rebuildwhy --version
          python -m rebuildwhy --version
          python -c 'from importlib.resources import files; assert files("rebuildwhy").joinpath("py.typed").is_file()'
          rebuildwhy plan -p examples/synthetic_mri/pipeline.yaml --json > /tmp/rebuildwhy-plan.json
          python -c 'import json; report = json.load(open("/tmp/rebuildwhy-plan.json")); assert len(report["tasks"]) == 5'
