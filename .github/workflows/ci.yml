name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Format
        run: python -m ruff format --check src tests examples
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=rebuildwhy --cov-branch --cov-report=term-missing --cov-fail-under=80

  package:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build frontend
        run: python -m pip install 'build>=1.5,<2'
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Smoke test installed entry points
        run: |
          python -m pip check
          rebuildwhy --version
          python -m rebuildwhy --version
          python -c 'from importlib.resources import files; assert files("rebuildwhy").joinpath("py.typed").is_file()'
