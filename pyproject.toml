[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rebuildwhy"
version = "0.1.0"
description = "Explainable cache invalidation for trusted local task pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "RebuildWhy Contributors" },
]
keywords = [
  "build-systems",
  "cache-invalidation",
  "content-addressed-storage",
  "reproducibility",
  "scientific-computing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "jsonschema>=4.25,<5",
  "mypy>=1.18,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<0.13",
  "types-jsonschema>=4.25",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
rebuildwhy = "rebuildwhy.cli:main"

[project.urls]
Repository = "https://github.com/b2ty9t7yhz-source/rebuildwhy"
Issues = "https://github.com/b2ty9t7yhz-source/rebuildwhy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rebuildwhy = ["py.typed"]

[tool.setuptools.data-files]
"share/rebuildwhy/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["rebuildwhy"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples"]
